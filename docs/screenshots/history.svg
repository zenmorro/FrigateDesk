<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Inter, system-ui, Segoe UI, sans-serif">
  <rect width="1000" height="620" fill="#020617"/>

  <!-- nav rail -->
  <rect x="0" y="0" width="72" height="620" fill="#0f172a"/>
  <line x1="72" y1="0" x2="72" y2="620" stroke="#1e293b"/>
  <rect x="16" y="16" width="40" height="40" rx="10" fill="#0284c7"/>
  <rect x="25" y="29" width="22" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
  <polygon points="33,33 33,39 39,36" fill="#fff"/>
  <rect x="26" y="88" width="20" height="13" rx="3" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="36" y="122" fill="#64748b" font-size="10" text-anchor="middle">Live</text>
  <!-- History (active) -->
  <rect x="9" y="140" width="54" height="52" rx="12" fill="#082f49"/>
  <rect x="0" y="152" width="4" height="28" rx="2" fill="#0ea5e9"/>
  <rect x="26" y="152" width="20" height="15" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="36" y="186" fill="#38bdf8" font-size="10" text-anchor="middle">History</text>
  <circle cx="36" cy="222" r="8" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="36" y="250" fill="#64748b" font-size="10" text-anchor="middle">Events</text>

  <!-- topbar -->
  <text x="100" y="40" fill="#e2e8f0" font-size="16" font-weight="600">History</text>
  <rect x="903" y="27" width="64" height="20" rx="10" fill="#064e3b"/>
  <circle cx="915" cy="37" r="3" fill="#10b981"/>
  <text x="924" y="41" fill="#6ee7b7" font-size="10">online</text>
  <line x1="72" y1="60" x2="1000" y2="60" stroke="#1e293b"/>

  <!-- camera list -->
  <line x1="264" y1="60" x2="264" y2="620" stroke="#1e293b"/>
  <text x="100" y="94" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">CAMERAS · 4</text>
  <rect x="92" y="104" width="160" height="32" rx="8" fill="#082f49"/>
  <text x="112" y="124" fill="#7dd3fc" font-size="12" font-weight="500">Front Door</text>
  <g fill="#cbd5e1" font-size="12">
    <text x="112" y="162">Driveway</text>
    <text x="112" y="200">Backyard</text>
    <text x="112" y="238">Garage</text>
  </g>

  <!-- camera title -->
  <text x="292" y="96" fill="#38bdf8" font-size="18" font-weight="600">Front Door</text>

  <!-- range + actions card -->
  <rect x="292" y="112" width="676" height="58" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="308" y="134" fill="#64748b" font-size="10">Start</text>
  <rect x="308" y="140" width="150" height="22" rx="6" fill="#1e293b"/>
  <text x="316" y="155" fill="#cbd5e1" font-size="11">2026-02-14 09:00</text>
  <text x="474" y="134" fill="#64748b" font-size="10">End</text>
  <rect x="474" y="140" width="150" height="22" rx="6" fill="#1e293b"/>
  <text x="482" y="155" fill="#cbd5e1" font-size="11">2026-02-14 10:00</text>
  <rect x="640" y="139" width="92" height="24" rx="8" fill="#0284c7"/>
  <text x="686" y="155" fill="#fff" font-size="11" text-anchor="middle">▶ Play range</text>
  <rect x="742" y="139" width="80" height="24" rx="8" fill="#1e293b"/>
  <text x="782" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle">Last hour</text>
  <rect x="832" y="139" width="96" height="24" rx="8" fill="#1e293b"/>
  <text x="880" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle">⤓ Download</text>

  <!-- timeline card -->
  <rect x="292" y="186" width="676" height="96" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="308" y="208" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">TIMELINE</text>
  <circle cx="378" cy="204" r="4" fill="#ef4444"/><text x="386" y="208" fill="#94a3b8" font-size="10">alert</text>
  <circle cx="430" cy="204" r="4" fill="#fb923c"/><text x="438" y="208" fill="#94a3b8" font-size="10">detection</text>
  <circle cx="500" cy="204" r="4" fill="#0ea5e9"/><text x="508" y="208" fill="#94a3b8" font-size="10">event</text>
  <!-- track -->
  <rect x="308" y="220" width="644" height="40" rx="6" fill="#1e293b"/>
  <rect x="360" y="224" width="60" height="18" rx="3" fill="#ef4444" opacity="0.85"/>
  <rect x="520" y="224" width="36" height="18" rx="3" fill="#fb923c" opacity="0.85"/>
  <rect x="620" y="224" width="90" height="18" rx="3" fill="#ef4444" opacity="0.85"/>
  <rect x="800" y="224" width="44" height="18" rx="3" fill="#fb923c" opacity="0.85"/>
  <rect x="372" y="238" width="2" height="18" fill="#38bdf8"/>
  <rect x="540" y="238" width="2" height="18" fill="#38bdf8"/>
  <rect x="650" y="238" width="2" height="18" fill="#38bdf8"/>
  <rect x="820" y="238" width="2" height="18" fill="#38bdf8"/>
  <text x="308" y="274" fill="#64748b" font-size="9">09:00</text>
  <text x="628" y="274" fill="#64748b" font-size="9">09:30</text>
  <text x="936" y="274" fill="#64748b" font-size="9">10:00</text>

  <!-- controls card -->
  <rect x="292" y="298" width="676" height="52" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <rect x="308" y="314" width="56" height="22" rx="6" fill="#1e293b"/><text x="336" y="329" fill="#cbd5e1" font-size="11" text-anchor="middle">↺ 10s</text>
  <rect x="372" y="314" width="72" height="22" rx="6" fill="#1e293b"/><text x="408" y="329" fill="#cbd5e1" font-size="11" text-anchor="middle">⏸ Pause</text>
  <rect x="452" y="314" width="56" height="22" rx="6" fill="#1e293b"/><text x="480" y="329" fill="#cbd5e1" font-size="11" text-anchor="middle">10s ↻</text>
  <rect x="516" y="314" width="60" height="22" rx="6" fill="#1e293b"/><text x="546" y="329" fill="#cbd5e1" font-size="11" text-anchor="middle">■ Stop</text>
  <rect x="820" y="314" width="52" height="22" rx="9" fill="#064e3b"/><text x="846" y="329" fill="#6ee7b7" font-size="10" text-anchor="middle">playing</text>
  <text x="884" y="329" fill="#94a3b8" font-size="10">hevc · d3d11va</text>

  <!-- mpv window note -->
  <rect x="292" y="368" width="676" height="226" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="630" y="476" fill="#334155" font-size="13" text-anchor="middle">Recording plays in a native mpv window</text>
  <text x="630" y="496" fill="#334155" font-size="11" text-anchor="middle">(H.265 / HEVC · D3D11VA hardware decode)</text>
</svg>
