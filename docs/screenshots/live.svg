<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Inter, system-ui, Segoe UI, sans-serif">
  <rect width="1000" height="620" fill="#020617"/>

  <!-- nav rail -->
  <rect x="0" y="0" width="72" height="620" fill="#0f172a"/>
  <line x1="72" y1="0" x2="72" y2="620" stroke="#1e293b"/>
  <rect x="16" y="16" width="40" height="40" rx="10" fill="#0284c7"/>
  <rect x="25" y="29" width="22" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
  <polygon points="33,33 33,39 39,36" fill="#fff"/>
  <!-- Live (active) -->
  <rect x="9" y="76" width="54" height="52" rx="12" fill="#082f49"/>
  <rect x="0" y="88" width="4" height="28" rx="2" fill="#0ea5e9"/>
  <rect x="26" y="88" width="20" height="13" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="36" y="122" fill="#38bdf8" font-size="10" text-anchor="middle">Live</text>
  <!-- History -->
  <rect x="26" y="150" width="20" height="15" rx="3" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="36" y="186" fill="#64748b" font-size="10" text-anchor="middle">History</text>
  <!-- Events -->
  <circle cx="36" cy="222" r="8" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="36" y="250" fill="#64748b" font-size="10" text-anchor="middle">Events</text>

  <!-- topbar -->
  <text x="100" y="40" fill="#e2e8f0" font-size="16" font-weight="600">Live view</text>
  <text x="620" y="40" fill="#94a3b8" font-size="12" text-anchor="end" transform="translate(300,0)">Home NVR · Frigate v0.16</text>
  <rect x="903" y="27" width="64" height="20" rx="10" fill="#064e3b"/>
  <circle cx="915" cy="37" r="3" fill="#10b981"/>
  <text x="924" y="41" fill="#6ee7b7" font-size="10">online</text>
  <line x1="72" y1="60" x2="1000" y2="60" stroke="#1e293b"/>

  <!-- camera list -->
  <text x="100" y="94" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">CAMERAS</text>
  <g font-size="12" fill="#cbd5e1">
    <rect x="92" y="104" width="170" height="32" rx="8" fill="#0f172a"/>
    <circle cx="106" cy="120" r="2" fill="#475569"/><circle cx="106" cy="126" r="2" fill="#475569"/>
    <text x="120" y="124">Front Door</text>
    <rect x="92" y="142" width="170" height="32" rx="8" fill="#0f172a"/>
    <text x="120" y="162">Driveway</text>
    <rect x="92" y="180" width="170" height="32" rx="8" fill="#0f172a"/>
    <text x="120" y="200">Backyard</text>
    <rect x="92" y="218" width="170" height="32" rx="8" fill="#0f172a"/>
    <text x="120" y="238">Garage</text>
  </g>

  <!-- segmented layout control -->
  <rect x="288" y="78" width="96" height="26" rx="8" fill="#1e293b"/>
  <rect x="290" y="80" width="30" height="22" rx="6" fill="#334155"/>
  <text x="305" y="95" fill="#7dd3fc" font-size="11" text-anchor="middle">1</text>
  <text x="337" y="95" fill="#94a3b8" font-size="11" text-anchor="middle">2</text>
  <text x="371" y="95" fill="#94a3b8" font-size="11" text-anchor="middle">2×2</text>

  <!-- grid 2x2 -->
  <defs>
    <linearGradient id="feed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <g>
    <!-- tile 1 -->
    <rect x="288" y="116" width="345" height="235" rx="12" fill="url(#feed)" stroke="#1e293b"/>
    <rect x="288" y="300" width="345" height="51" rx="0" fill="#0a0f1d" opacity="0.4"/>
    <circle cx="308" cy="138" r="4" fill="#34d399"/>
    <text x="320" y="142" fill="#e2e8f0" font-size="12" font-weight="500">Front Door</text>
    <!-- tile 2 -->
    <rect x="645" y="116" width="345" height="235" rx="12" fill="url(#feed)" stroke="#1e293b"/>
    <circle cx="665" cy="138" r="4" fill="#34d399"/>
    <text x="677" y="142" fill="#e2e8f0" font-size="12" font-weight="500">Driveway</text>
    <!-- tile 3 -->
    <rect x="288" y="363" width="345" height="235" rx="12" fill="url(#feed)" stroke="#1e293b"/>
    <circle cx="308" cy="385" r="4" fill="#34d399"/>
    <text x="320" y="389" fill="#e2e8f0" font-size="12" font-weight="500">Backyard</text>
    <!-- tile 4 -->
    <rect x="645" y="363" width="345" height="235" rx="12" fill="url(#feed)" stroke="#1e293b"/>
    <circle cx="665" cy="385" r="4" fill="#34d399"/>
    <text x="677" y="389" fill="#e2e8f0" font-size="12" font-weight="500">Garage</text>
  </g>
</svg>
