<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Inter, system-ui, Segoe UI, sans-serif">
  <rect width="1000" height="620" fill="#020617"/>

  <!-- nav rail -->
  <rect x="0" y="0" width="72" height="620" fill="#0f172a"/>
  <line x1="72" y1="0" x2="72" y2="620" stroke="#1e293b"/>
  <rect x="16" y="16" width="40" height="40" rx="10" fill="#0284c7"/>
  <rect x="25" y="29" width="22" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
  <polygon points="33,33 33,39 39,36" fill="#fff"/>
  <rect x="26" y="88" width="20" height="13" rx="3" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="36" y="122" fill="#64748b" font-size="10" text-anchor="middle">Live</text>
  <rect x="26" y="152" width="20" height="15" rx="3" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="36" y="186" fill="#64748b" font-size="10" text-anchor="middle">History</text>
  <!-- Events (active) -->
  <rect x="9" y="204" width="54" height="52" rx="12" fill="#082f49"/>
  <rect x="0" y="216" width="4" height="28" rx="2" fill="#0ea5e9"/>
  <circle cx="36" cy="222" r="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="36" y="250" fill="#38bdf8" font-size="10" text-anchor="middle">Events</text>

  <!-- topbar -->
  <text x="100" y="40" fill="#e2e8f0" font-size="16" font-weight="600">Events</text>
  <rect x="903" y="27" width="64" height="20" rx="10" fill="#064e3b"/>
  <circle cx="915" cy="37" r="3" fill="#10b981"/>
  <text x="924" y="41" fill="#6ee7b7" font-size="10">online</text>
  <line x1="72" y1="60" x2="1000" y2="60" stroke="#1e293b"/>

  <!-- filter bar -->
  <g font-size="10" fill="#64748b">
    <text x="100" y="86">Camera</text><rect x="100" y="92" width="120" height="24" rx="6" fill="#1e293b"/><text x="112" y="108" fill="#cbd5e1" font-size="11">All cameras</text>
    <text x="236" y="86">Label</text><rect x="236" y="92" width="110" height="24" rx="6" fill="#1e293b"/><text x="248" y="108" fill="#cbd5e1" font-size="11">All labels</text>
    <text x="362" y="86">From</text><rect x="362" y="92" width="150" height="24" rx="6" fill="#1e293b"/><text x="372" y="108" fill="#cbd5e1" font-size="11">2026-02-13 10:00</text>
    <text x="528" y="86">To</text><rect x="528" y="92" width="150" height="24" rx="6" fill="#1e293b"/><text x="538" y="108" fill="#cbd5e1" font-size="11">2026-02-14 10:00</text>
  </g>
  <text x="968" y="108" fill="#94a3b8" font-size="11" text-anchor="end">18 events</text>
  <line x1="72" y1="132" x2="1000" y2="132" stroke="#1e293b"/>

  <!-- event rows -->
  <g>
    <!-- row 1 -->
    <rect x="140" y="148" width="560" height="60" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <rect x="150" y="155" width="90" height="46" rx="6" fill="#1e293b"/>
    <circle cx="195" cy="178" r="12" fill="#334155"/>
    <text x="256" y="176" fill="#e2e8f0" font-size="13" font-weight="500">person</text>
    <rect x="304" y="166" width="70" height="16" rx="8" fill="#1e293b"/><text x="339" y="178" fill="#94a3b8" font-size="10" text-anchor="middle">Front Door</text>
    <text x="384" y="178" fill="#64748b" font-size="10">82%</text>
    <text x="256" y="193" fill="#64748b" font-size="11">2026-02-14 09:42:11 · 24s</text>
    <rect x="560" y="166" width="66" height="24" rx="6" fill="#1e293b"/><text x="593" y="182" fill="#cbd5e1" font-size="11" text-anchor="middle">▶ Open</text>
    <rect x="634" y="166" width="30" height="24" rx="6" fill="#1e293b"/><text x="649" y="183" fill="#cbd5e1" font-size="12" text-anchor="middle">⤓</text>

    <!-- row 2 (hovered) -->
    <rect x="140" y="216" width="560" height="60" rx="10" fill="#0f172a" stroke="#0ea5e9"/>
    <rect x="150" y="223" width="90" height="46" rx="6" fill="#1e293b"/>
    <rect x="175" y="238" width="40" height="16" rx="3" fill="#475569"/>
    <text x="256" y="244" fill="#e2e8f0" font-size="13" font-weight="500">car</text>
    <rect x="286" y="234" width="66" height="16" rx="8" fill="#1e293b"/><text x="319" y="246" fill="#94a3b8" font-size="10" text-anchor="middle">Driveway</text>
    <text x="362" y="246" fill="#64748b" font-size="10">91%</text>
    <text x="256" y="261" fill="#64748b" font-size="11">2026-02-14 09:17:03 · 1m 12s</text>
    <rect x="560" y="234" width="66" height="24" rx="6" fill="#1e293b"/><text x="593" y="250" fill="#cbd5e1" font-size="11" text-anchor="middle">▶ Open</text>
    <rect x="634" y="234" width="30" height="24" rx="6" fill="#1e293b"/><text x="649" y="251" fill="#cbd5e1" font-size="12" text-anchor="middle">⤓</text>

    <!-- row 3 -->
    <rect x="140" y="284" width="560" height="60" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <rect x="150" y="291" width="90" height="46" rx="6" fill="#1e293b"/>
    <text x="256" y="312" fill="#e2e8f0" font-size="13" font-weight="500">person</text>
    <rect x="304" y="302" width="66" height="16" rx="8" fill="#1e293b"/><text x="337" y="314" fill="#94a3b8" font-size="10" text-anchor="middle">Backyard</text>
    <text x="256" y="329" fill="#64748b" font-size="11">2026-02-14 08:55:40 · 9s</text>
    <rect x="560" y="302" width="66" height="24" rx="6" fill="#1e293b"/><text x="593" y="318" fill="#cbd5e1" font-size="11" text-anchor="middle">▶ Open</text>
    <rect x="634" y="302" width="30" height="24" rx="6" fill="#1e293b"/><text x="649" y="319" fill="#cbd5e1" font-size="12" text-anchor="middle">⤓</text>
  </g>

  <!-- hover preview popup -->
  <g>
    <rect x="690" y="236" width="250" height="168" rx="12" fill="#0f172a" stroke="#334155"/>
    <rect x="700" y="246" width="230" height="124" rx="6" fill="#0b1220"/>
    <defs>
      <linearGradient id="prev" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0b1220"/>
      </linearGradient>
    </defs>
    <rect x="700" y="246" width="230" height="124" rx="6" fill="url(#prev)"/>
    <circle cx="760" cy="316" r="18" fill="#334155"/>
    <rect x="790" y="300" width="70" height="30" rx="4" fill="#475569"/>
    <text x="710" y="390" fill="#e2e8f0" font-size="12" font-weight="500">car</text>
    <text x="922" y="390" fill="#64748b" font-size="10" text-anchor="end">09:17:03</text>
    <text x="815" y="262" fill="#38bdf8" font-size="9" text-anchor="middle" opacity="0.8">preview.gif</text>
  </g>
</svg>
